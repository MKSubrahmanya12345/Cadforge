# CADForge — MongoDB only.
# The cad-worker runs locally on Python (see SETUP.md); only the database is containerised.
#
#   docker compose up -d
#
services:
  mongo:
    image: mongo:7
    container_name: cadforge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cadforge
    volumes:
      - cadforge-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cadforge-mongo-data:
